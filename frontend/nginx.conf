server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing): serve index.html for any path
    # that doesn't match a real file, so deep-link/refresh doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
