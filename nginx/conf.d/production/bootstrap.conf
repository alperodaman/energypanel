# Production bootstrap — plain HTTP only, no SSL directives (mimari dokümanı §6.3).
# Used once, before the first Let's Encrypt certificate exists: an nginx config that
# references ssl_certificate paths which don't exist yet would fail to start. This file
# stays in place just long enough to serve the ACME HTTP-01 challenge for the initial
# `certbot certonly --webroot` run; afterwards it's replaced by final.conf (copied from
# final.conf.template) which adds the 443/SSL server blocks.
server {
    listen 80;
    server_name energypanel.alperodaman.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.energypanel.alperodaman.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /realtime/ {
        rewrite ^/realtime/(.*)$ /$1 break;
        proxy_pass http://realtime-service:3005;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gateway:4000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
