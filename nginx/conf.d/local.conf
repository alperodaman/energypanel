# Local simulation of the EC2 reverse-proxy topology (mimari dokümanı §6.3),
# minus the SSL/certbot blocks — plain HTTP only, that part is an EC2-only step.
#
# Path-based routing was chosen over server_name/host-based routing: the gateway's
# REST routes live at the root (/facilities, /auth, ...) and collide with the SPA's
# own client-side routes (e.g. GET /facilities/:id is both a page and an API call),
# so API traffic is namespaced under /api/ and stripped back to root before reaching
# the gateway. Same idea for /realtime/ in front of the realtime-service's Socket.IO
# endpoint (default path /socket.io/).
server {
    listen 80;
    server_name _;

    location /realtime/ {
        rewrite ^/realtime/(.*)$ /$1 break;
        proxy_pass http://realtime-service:3005;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway:4000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
